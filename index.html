<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Руслан & Алёна • Свадьба</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <video autoplay muted loop playsinline class="bg-video">
    <source src="assets/ring-video.mp4" type="video/mp4" />
  </video>

  <main class="container">
    <section class="hero">
      <h1 class="calligraphy">Руслан & Алёна</h1>
      <div class="divider"></div>
      <p class="date">08 / 09 / 27</p>
    </section>

    <section class="program fade-up">
      <h2>Программа дня</h2>
      <ul>
        <li><span>14:00</span> Сбор гостей</li>
        <li><span>15:00</span> Церемония</li>
        <li><span>17:00</span> Банкет</li>
        <li><span>21:00</span> Первый танец</li>
      </ul>
    </section>

    <section class="location fade-up delay-1">
      <h2>Место</h2>
      <p>Ресторан «Астория», зал «Золотой»<br>г. Москва, ул. Тверская, 1</p>
    </section>

    <section class="rsvp fade-up delay-2">
      <h2>Подтвердите присутствие</h2>
      <form id="rsvp-form">
        <input type="text" placeholder="Ваше имя" required />
        <input type="email" placeholder="Email" required />
        <button type="submit">Отправить</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
