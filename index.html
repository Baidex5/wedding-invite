<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Руслан & Алёна • Свадьба</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    /* --- БАЗА --- */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      color: #1a1a1a;
      background-color: #ffffff;
      overflow-x: hidden;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    /* --- СЕТКА ДЛЯ ТЕКСТА И ФОТО --- */
    .intro-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }

    .intro-text {
      text-align: left;
    }

    .calligraphy-small {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 3.5rem;
      line-height: 1.1;
      margin: 0 0 25px 0;
      color: #1a1a1a;
    }

    .intro-message {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #333;
      margin: 0;
    }

    /* --- ГЛАВНЫЙ БЛОК С АРКОЙ (ИСПРАВЛЕНО) --- */
    .photo-wrapper {
      position: relative;
      width: 100%;
      /* Важно: не задаем высоту, она будет по фото */
      overflow: hidden; 
      border-radius: 0 0 24px 24px; /* Скругление только низа */
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15);
      background: #fff;
    }

    .photo-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      /* Фото целое, ничего не режем */
    }

    /* --- БЕЛАЯ АРКА (МАСКА) --- */
    .arch-mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #fff;
      z-index: 10;
      
      /* Магия: вырезаем дырку в белом фоне */
      /* circle at top = центр круга сверху по центру */
      /* transparent 45% = прозрачная часть (дырка) до 45% высоты */
      /* black 55% = белая часть начинается после дырки */
      -webkit-mask-image: radial-gradient(circle at top, transparent 45%, black 55%);
      mask-image: radial-gradient(circle at top, transparent 45%, black 55%);
      
      /* Чтобы края были гладкими */
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    /* --- АДАПТИВНОСТЬ (ТЕЛЕФОН) --- */
    @media (max-width: 768px) {
      .intro-content {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 40px;
      }

      .calligraphy-small {
        font-size: 2rem;
      }

      /* На телефоне делаем арку чуть больше, чтобы головы точно влезли */
      .arch-mask {
        -webkit-mask-image: radial-gradient(circle at top, transparent 50%, black 60%);
        mask-image: radial-gradient(circle at top, transparent 50%, black 60%);
      }
    }
  </style>
</head>
<body>

  <main class="container">
    
    <section class="intro">
      <div class="intro-content">
        <div class="intro-text">
          <p class="calligraphy-small">Я люблю тебя<br>больше чем<br>вчера</p>
          <p class="intro-message">
            Это официальное приглашение на нашу свадьбу!<br>
            А получили вы его потому, что мы очень хотим видеть вас в этот день рядом с нами :)
          </p>
        </div>
        
        <!-- Блок с фото и маской -->
        <div class="photo-wrapper">
          <!-- Путь к фото: assets/arch-photo.jpg -->
          <img src="assets/arch-photo.jpg" alt="Пара в арке" loading="lazy">
          
          <!-- Белая маска с вырезом -->
          <div class="arch-mask"></div>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
