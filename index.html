<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Руслан & Алёна • Свадьба</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      color: #1a1a1a;
      background-color: #ffffff;
      overflow-x: hidden;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .intro-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }

    .intro-text {
      text-align: left;
    }

    .calligraphy-small {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 3.5rem;
      line-height: 1.1;
      margin: 0 0 25px 0;
      color: #1a1a1a;
    }

    .intro-message {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #333;
      margin: 0;
    }

    /* Блок с фото и аркой */
    .photo-card {
      position: relative;
      width: 100%;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15);
      background: #fff;
      overflow: hidden;
      padding: 10px;
    }

    .arch-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      /* Арка: M0 0 L0 100% L100% 100% L100% 0 - это границы прямоугольника */
      /* Q50% 35% 0 0 - это сама дуга. 50% - центр, 35% - высота дуги. */
      /* Высота 35% подобрана так, чтобы арка мягко накрывала верх, не срезая головы */
      clip-path: path('M0 0 L0 100% L100% 100% L100% 0 Q50% 35% 0 0 Z');
    }

    @media (max-width: 768px) {
      .intro-content {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 40px;
      }

      .calligraphy-small {
        font-size: 2rem;
      }

      .photo-card {
        margin-top: 20px;
      }

      /* На мобильном чуть увеличиваем высоту арки, чтобы точно влезли головы */
      .arch-image {
        clip-path: path('M0 0 L0 100% L100% 100% L100% 0 Q50% 40% 0 0 Z');
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <section class="intro">
      <div class="intro-content">
        <div class="intro-text">
          <p class="calligraphy-small">Я люблю тебя<br>больше чем<br>вчера</p>
          <p class="intro-message">
            Это официальное приглашение на нашу свадьбу!<br>
            А получили вы его потому, что мы очень хотим видеть вас в этот день рядом с нами :)
          </p>
        </div>
        
        <div class="photo-card">
          <!-- Убедись, что путь к фото верный -->
          <img src="assets/arch-photo.jpg" alt="Пара" class="arch-image" loading="lazy">
        </div>
      </div>
    </section>
  </main>

</body>
</html>
